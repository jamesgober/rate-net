name: Latest dependencies

# The main CI builds against the committed Cargo.lock. This workflow resolves
# the newest versions every dependency's requirement allows and builds, tests,
# lints, and audits against them: on 1.99.0 the true latest (the MSRV-aware
# resolver is told to ignore rust-version), on 1.85 the latest that still
# supports the MSRV — weekly, and on every pull request — so an upstream
# release that breaks rate-net, or a new advisory, shows up before a user hits
# it. A failure here means: update the lock (or a requirement) in a PR.

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  latest:
    name: Latest dependencies (${{ matrix.rust }}, rust-version ${{ matrix.incompatible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: "1.99.0"
            incompatible: allow
          - rust: "1.85"
            incompatible: fallback
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: ${{ matrix.incompatible }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Toolchain
        run: rustc -V && cargo -V
      - name: Update to the latest compatible versions
        run: cargo update --verbose
      - name: Build (all features)
        run: cargo build --all-targets --all-features
      - name: Test (all features)
        run: cargo test --all-features
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Audit
        run: cargo audit
