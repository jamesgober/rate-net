name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test (all features)
        run: cargo test --all-features
      - name: Doc (all features)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Every feature on its own (and none, and the default set): an optional
  # feature must never depend on another to compile, and the lean builds must
  # stay warning-free and documented. cargo-hack enumerates the set from
  # Cargo.toml, so a new feature is covered without editing this file.
  features:
    name: Features (each, on ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Clippy (each feature)
        run: cargo hack clippy --each-feature --all-targets -- -D warnings
      - name: Test (each feature)
        run: cargo hack test --each-feature
      - name: Doc (each feature)
        run: cargo hack doc --each-feature --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  pedantic:
    name: Clippy pedantic (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy pedantic (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic

  # The real-clock contention and eviction tests in release mode, where the
  # check path is fast enough for threads to genuinely race on one key.
  stress:
    name: Stress (release, real clock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Real-clock, stress, and eviction tests, optimised
        run: cargo test --release --all-features --test real_clock --test stress --test eviction_bypass

  loom:
    name: Loom (model check of the production limiter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # clock-lib 1.1.0 uses `loom` in library code under cfg(loom) but declares
      # it only as a dev-dependency, so it cannot build with --cfg loom; 1.0.0
      # satisfies rate-net's `clock-lib = "1.0"`.
      - name: Pin clock-lib for the loom build
        run: cargo update -p clock-lib --precise 1.0.0
      - name: Loom
        run: cargo test --test loom_check --features algorithms --release
        env:
          RUSTFLAGS: "--cfg loom"

  miri:
    name: Miri (atomic algorithm state and the store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # Miri makes weak compare-and-swap fail spuriously, which native x86 runs
      # never do; it is what exercises the CAS retry paths.
      - name: Miri
        run: |
          cargo miri test --lib --all-features -- algo:: gcra:: store::tests::test_peek store::tests::test_capacity_boundaries store::tests::test_clock_scan store::tests::test_evicted_key_resumes store::tests::test_remove_reset_and_clear metrics::
        env:
          RUSTFLAGS: ""
          MIRIFLAGS: "-Zmiri-disable-isolation"

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # cargo-fuzz manages its own RUSTFLAGS (sanitizer instrumentation); clear
      # the workflow-wide `-D warnings` so it does not fight the fuzz build.
      # Pin the fuzz target to the gnu triple: the prebuilt cargo-fuzz binary is
      # musl-static, so it would otherwise default to musl, whose std the
      # nightly toolchain does not ship. New inputs go to corpus/, never seeds/.
      - name: Fuzz limiter_ops (60s)
        run: cargo +nightly fuzz run limiter_ops fuzz/corpus/limiter_ops fuzz/seeds/limiter_ops --target x86_64-unknown-linux-gnu -- -max_total_time=60
        env:
          RUSTFLAGS: ""
      - name: Fuzz http_keys (30s)
        run: cargo +nightly fuzz run http_keys fuzz/corpus/http_keys fuzz/seeds/http_keys --target x86_64-unknown-linux-gnu -- -max_total_time=30
        env:
          RUSTFLAGS: ""

  no-std:
    name: no_std (thumbv7em-none-eabihf, wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # thumbv7em has no 64-bit atomics, so this checks the data-type surface.
      - name: Build the no_std core for an embedded target
        run: cargo build --lib --no-default-features --target thumbv7em-none-eabihf
      # wasm32 has 64-bit atomics: this builds `Gcra` itself without std.
      - name: Build the no_std Gcra core
        run: cargo build --lib --no-default-features --target wasm32-unknown-unknown

  i686:
    name: 32-bit (i686-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install the 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Test (all features, 32-bit)
        run: cargo test --all-features --target i686-unknown-linux-gnu

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage summary
        run: cargo llvm-cov --all-features --summary-only

  semver:
    name: SemVer (cargo-semver-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      # Libraries do not commit Cargo.lock; resolve the latest compatible tree
      # so the audit sees what a fresh consumer would build.
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check
