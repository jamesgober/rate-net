[package]
name    = "rate-net"
version = "1.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Repository tooling that is not part of the library: the development
# toolchain pin, CI, editor and lint configuration, fuzzing, proptest seeds,
# and the engineering standard.
exclude = [
    ".editorconfig",
    ".gitattributes",
    ".github/",
    ".gitignore",
    "clippy.toml",
    "deny.toml",
    "fuzz/",
    "proptest-regressions/",
    "REPS.md",
    "rust-toolchain.toml",
    "rustfmt.toml",
]

# Description
description = "A rate limiter for Rust: five algorithms behind one trait, sharded per-key state with O(1) bounded-memory eviction, retry-after and RateLimit headers, a no_std single-key core, and a one-line Tier-1 API. Built against hostile traffic."

# Keywords (5 max)
keywords = [
    "rate-limiting",
    "rate-limiter",
    "throttle",
    "governor",
    "backpressure"
]

# Categories
categories = [
    "concurrency",
    "network-programming",
    "algorithms"
]

# Links
homepage      = "https://github.com/jamesgober/rate-net"
repository    = "https://github.com/jamesgober/rate-net"
documentation = "https://docs.rs/rate-net"

# Authors
authors = [
    "James Gober <me@jamesgober.com>"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "rate_net"
path = "src/lib.rs"



# LINTS
# #################################
# `loom` and `comparison` are build-time cfgs toggled via `RUSTFLAGS="--cfg ..."`
# (the concurrency model check and the `governor` comparison bench); `docsrs`
# is set by docs.rs and `fuzzing` by cargo-fuzz. Registering them keeps
# `unexpected_cfgs` quiet under `-D warnings`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(loom)',
    'cfg(comparison)',
    'cfg(docsrs)',
    'cfg(fuzzing)',
] }



# FEATURE FLAGS
# #################################
[features]
# Default build: std on, all core algorithms available.
default = ["std"]

# Standard library. The keyed limiter — the sharded per-key store, the
# token-bucket state (better-bucket's clock-free `BucketCore`), the injectable
# clock, `DirectLimiter`, `CoarseClock`, and the error-forge integration —
# requires std, so std gates `better-bucket`, `clock-lib`, `error-forge`,
# `ahash`, and `hashbrown`. With std off the crate is no_std and exposes the
# clock-free single-key core: `Gcra` (on targets with 64-bit atomics), `Quota`,
# `Decision`, `Snapshot`, the error types, and the header names and values.
std = [
    "dep:better-bucket",
    "dep:clock-lib",
    "clock-lib/std",
    "dep:error-forge",
    "dep:ahash",
    "dep:hashbrown",
]

# The full algorithm suite beyond the default token bucket: leaky bucket,
# fixed window, sliding-window log, sliding-window counter.
algorithms = []

# Optional async-friendly wrapper layer. Additive only — the core has no
# runtime dependency. Implies `std`, since the wrapper sits over the sharded
# store.
async = ["std", "dep:tokio"]

# Operational counters (allowed, denied, keys inserted / evicted / expired /
# removed / remembered / restored, overflowed debts, refused and rejected keys) read with
# `metrics()`. Off by default: without it the counters do not exist, so they
# cost nothing.
metrics = ["std"]

# `tower` middleware for inbound HTTP: `RateLimitLayer` with key extractors
# (peer IP, X-Forwarded-For, header, closure) and 429 responses carrying
# Retry-After and RateLimit headers. Adds the `http` types and the two tower
# trait crates — not `tower` itself.
tower = ["std", "dep:http", "dep:tower-layer", "dep:tower-service", "dep:pin-project-lite"]



# DEPENDENCIES
# #################################
[dependencies]
# Token-bucket accounting (the single source of truth; we never re-implement it).
# Only the clock-free `BucketCore` is used — the limiter reads the clock once per
# check and passes the time in — so no better-bucket feature is enabled and it
# brings no dependencies of its own. 1.1 is the floor: 1.0 over-granted under
# multi-threaded contention on a real clock (a stale timestamp read as a
# ~49.7-day refill), capped capacity at ~4.29M tokens, and had no `BucketCore`.
better-bucket = { version = "1.1", default-features = false, optional = true }
# Monotonic, mockable time for deterministic tests and the clock-injection seam.
clock-lib     = { version = "1.0", default-features = false, optional = true }
# Domain error type metadata (kind/caption), shared across the portfolio stack.
# 1.0.2 dropped its unused `thiserror` dependency (and `syn` with it).
error-forge   = { version = "1.0.2", optional = true }
# Fast, DoS-resistant hashing for the shard map and shard selection. A random
# per-store seed (runtime-rng) keeps it collision-attack resistant on hostile
# keys; required by `std` for the hot path.
ahash         = { version = "0.8", optional = true }
# The per-shard index. `HashTable` stores slot indices and takes the one
# precomputed hash, which is what makes O(1) swap-remove eviction possible
# without storing every key twice, and keeps a check to a single hash pass.
# It is std's own map implementation (rust-lang maintained, MSRV 1.85); with
# default features off it pulls in no dependencies of its own.
hashbrown     = { version = "0.17", default-features = false, features = ["inline-more"], optional = true }
# Optional async-friendly wrapper layer; additive only. Only the timer is used.
tokio         = { version = "1", default-features = false, features = ["time"], optional = true }
# The `tower` feature: the HTTP request/response types and the two tower trait
# crates (not `tower` itself), plus the pin projection for the response future
# so admitted requests pass through without boxing.
http             = { version = "1", optional = true }
tower-layer      = { version = "0.3.3", optional = true }
tower-service    = { version = "0.3.3", optional = true }
pin-project-lite = { version = "0.2", optional = true }

# `loom` replaces the limiter's own atomics and locks (`src/sync.rs`) under
# `cfg(loom)` model-checking builds, so the loom suite drives the production
# code. Never part of a normal build. (A regular, not dev, dependency because
# the library itself switches to it.)
[target.'cfg(loom)'.dependencies]
loom = "0.7"



# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
# `ServiceExt` / `service_fn` for exercising the `tower` middleware.
tower     = { version = "0.5", default-features = false, features = ["util"] }

# A minimal runtime to drive the `async` wrapper's tests and example. Excluded
# under `cfg(loom)`: a global `--cfg loom` switches tokio's internals to its own
# loom build, which needs feature flags the limiter does not, and the loom model
# check does not touch tokio anyway.
[target.'cfg(not(loom))'.dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }

# Benchmark-only: the incumbent for the head-to-head comparison. Gated on
# `cfg(comparison)` (set via `RUSTFLAGS="--cfg comparison"`) so it never enters
# the default tree, `--all-features`, or CI.
[target.'cfg(comparison)'.dev-dependencies]
governor = "0.10"



# EXAMPLES
# #################################
# Every example drives the std limiter, so each declares the features it needs;
# `cargo test --no-default-features` then skips them instead of failing.
[[example]]
name              = "per_second"
required-features = ["std"]

[[example]]
name              = "per_key"
required-features = ["std"]

[[example]]
name              = "mock_clock"
required-features = ["std"]

[[example]]
name              = "retry_after"
required-features = ["std"]

[[example]]
name              = "gatekeeper"
required-features = ["std"]

[[example]]
name              = "direct"
required-features = ["std"]

[[example]]
name              = "algorithms"
required-features = ["std", "algorithms"]

[[example]]
name              = "async_wait"
required-features = ["async"]

[[example]]
name              = "tower_layer"
required-features = ["tower"]



# BENCHMARKS
# #################################
[[bench]]
name              = "rate_bench"
harness           = false
required-features = ["std"]

[[bench]]
name    = "comparison"
harness = false

[[bench]]
name              = "flood"
harness           = false
required-features = ["std"]



# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
