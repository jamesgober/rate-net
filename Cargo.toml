[package]
name    = "rate-net"
version = "0.9.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "A powerful, lock-free rate limiter for Rust: multiple algorithms behind one trait, sharded per-key state, bounded-memory eviction, retry-after, and a one-line Tier-1 API. Built against hostile traffic."

# Keywords (5 max)
keywords = [
    "rate-limiting",
    "rate-limiter",
    "throttle",
    "governor",
    "backpressure"
]

# Categories
categories = [
    "concurrency",
    "network-programming",
    "algorithms"
]

# Links
homepage      = "https://github.com/jamesgober/rate-net"
repository    = "https://github.com/jamesgober/rate-net"
documentation = "https://docs.rs/rate-net"

# Authors
authors = [
    "James Gober <me@jamesgober.com>"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "rate_net"
path = "src/lib.rs"



# LINTS
# #################################
# `loom` and `comparison` are build-time cfgs toggled via `RUSTFLAGS="--cfg ..."`
# (the concurrency model check and the `governor` comparison bench); `docsrs` is
# set by docs.rs. Registering them keeps `unexpected_cfgs` quiet under
# `-D warnings`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(loom)',
    'cfg(comparison)',
    'cfg(docsrs)',
] }



# FEATURE FLAGS
# #################################
[features]
# Default build: std on, all core algorithms available.
default = ["std"]

# Standard library. The limiter — the sharded per-key store, the token-bucket
# core (better-bucket's clock-driven surface), the injectable clock, and the
# domain error type — requires std, so std gates `better-bucket`'s `clock`
# feature, `clock-lib`, and `error-forge`. With std off the crate is no_std and
# exposes only `VERSION`; the pared-down single-key mode follows in a later
# release.
std = [
    "dep:better-bucket",
    "better-bucket/clock",
    "dep:clock-lib",
    "clock-lib/std",
    "dep:error-forge",
    "dep:ahash",
]

# The full algorithm suite beyond the default token bucket: leaky bucket,
# fixed window, sliding-window log, sliding-window counter.
algorithms = []

# Optional async-friendly wrapper layer. Additive only — the core has no
# runtime dependency. Implies `std`, since the wrapper sits over the sharded
# store.
async = ["std", "dep:tokio"]



# DEPENDENCIES
# #################################
[dependencies]
# Token-bucket accounting (the single source of truth; we never re-implement it).
# Pulled in by `std` with its `clock` feature, which exposes the `Bucket` surface.
better-bucket = { version = "1.0", default-features = false, optional = true }
# Monotonic, mockable time for deterministic tests and the clock-injection seam.
clock-lib     = { version = "1.0", default-features = false, optional = true }
# Domain error type metadata (kind/caption), shared across the portfolio stack.
error-forge   = { version = "1.0", optional = true }
# Fast, DoS-resistant hashing for the shard map and shard selection. A random
# per-store seed (runtime-rng) keeps it collision-attack resistant on hostile
# keys; required by `std` for the hot path.
ahash         = { version = "0.8", optional = true }
# Optional async-friendly wrapper layer; additive only. Only the timer is used.
tokio         = { version = "1", default-features = false, features = ["time"], optional = true }



# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"

# `loom` is only pulled in under `cfg(loom)` model-checking builds.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

# A minimal runtime to drive the `async` wrapper's tests and example. Excluded
# under `cfg(loom)`: a global `--cfg loom` switches tokio's internals to its own
# loom build, which needs feature flags the limiter does not, and the loom model
# check does not touch tokio anyway.
[target.'cfg(not(loom))'.dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }

# Benchmark-only: the incumbent for the head-to-head comparison. Gated on
# `cfg(comparison)` (set via `RUSTFLAGS="--cfg comparison"`) so it never enters
# the default tree, `--all-features`, or CI.
[target.'cfg(comparison)'.dev-dependencies]
governor = "0.8"



# EXAMPLES
# #################################
# Most examples build on the always-available token bucket; these two need an
# opt-in feature, so they are only compiled when it is enabled.
[[example]]
name              = "algorithms"
required-features = ["algorithms"]

[[example]]
name              = "async_wait"
required-features = ["async"]



# BENCHMARKS
# #################################
[[bench]]
name    = "rate_bench"
harness = false

[[bench]]
name    = "comparison"
harness = false



# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
