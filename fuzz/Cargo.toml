# cargo-fuzz target crate for rate-net: the limiter driven by arbitrary
# operation sequences against an oracle, and the byte-facing HTTP surfaces.
#
# Run locally (needs nightly + cargo-fuzz), from the repository root; the
# corpus directories are not committed, so create them first:
#   mkdir -p fuzz/corpus/limiter_ops fuzz/corpus/http_keys
#   cargo +nightly fuzz run limiter_ops fuzz/corpus/limiter_ops fuzz/seeds/limiter_ops
#   cargo +nightly fuzz run http_keys fuzz/corpus/http_keys fuzz/seeds/http_keys
#
# Seed inputs are committed under seeds/; the working corpus/ (listed first,
# so new inputs land there) is not.
# CI runs each target for a fixed time budget as a smoke check.
[package]
name    = "rate-net-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary     = { version = "1", features = ["derive"] }
clock-lib     = "1"
http          = "1"

[dependencies.rate-net]
path     = ".."
features = ["algorithms", "metrics", "tower"]

# Keep the fuzz crate out of any parent workspace.
[workspace]

[profile.release]
debug = 1

[[bin]]
name  = "limiter_ops"
path  = "fuzz_targets/limiter_ops.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "http_keys"
path  = "fuzz_targets/http_keys.rs"
test  = false
doc   = false
bench = false
